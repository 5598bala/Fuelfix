databases:
  - name: fuelfix-db
    databaseName: fuelfix
    user: fuelfix
    plan: free

services:
  - type: web
    name: fuelfix
    runtime: python
    plan: free
    buildCommand: bash ./build.sh
    startCommand: 'python -c "import jwt; print(''PyJWT'', jwt.__version__)" && exec python -m gunicorn Fuelfix.wsgi:application --bind 0.0.0.0:$PORT'
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fuelfix-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DJANGO_SETTINGS_MODULE
        value: Fuelfix.render_settings
      - key: MERAOTP_API_KEY
        sync: false
      - key: GEOAPIFY_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
